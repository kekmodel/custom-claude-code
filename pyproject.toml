[project]
name = "custom-claude-code"
version = "0.1.0"
description = "Custom implementation of Claude Code for learning purposes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "langgraph>=0.1.0",
    "openai-agents>=0.5.0",
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "langchain-openai>=1.0.3",
    "langchain-anthropic>=1.0.4",
    "langchain>=1.0.7",
    "langchain-google-genai>=3.0.3",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.2",
    "ddgs>=9.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_claude_code"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
